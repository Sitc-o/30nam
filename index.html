<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>30 năm Viettel Commerce</title>
  <meta name="description" content="30 năm Viettel Commerce – Vững bước tiên phong – Kiến tạo tương lai">
  <link rel="stylesheet" href="assets/css/home-approved.css">
  <link rel="stylesheet" href="assets/css/book-menu.css">
  <link rel="stylesheet" href="assets/css/page-transitions.css?v=15">
  <link rel="stylesheet" href="assets/css/flipbook.css">
</head>
<body>
  <main class="flipbook-layout">
    
    <nav class="top-nav" aria-label="Điều hướng chính">
      <a href="gioi-thieu.html">Giới thiệu</a>
      <a href="hanh-trinh.html">Hành trình</a>
      <a href="mo-hinh-to-chuc.html">Mô hình tổ chức</a>
      <a href="thanh-tuu-khen-thuong.html">Thành tựu</a>
    </nav>
    <!-- Cành cây trang trí background -->
    <div class="bg-branches" aria-hidden="true">
        <img src="assets/images/branch.png" alt="" class="branch branch-top-left">
        <img src="assets/images/branch.png" alt="" class="branch branch-bottom-right">
    </div>

    <!-- Con số kỷ niệm chìm khổng lồ -->
    <div class="bg-watermark" aria-hidden="true">
        <span class="year-left">1996</span>
        <span class="year-right">2026</span>
    </div>

    <!-- Tia sáng (God Rays) hắt từ góc phải -->
    <div class="god-rays" aria-hidden="true"></div>

    <!-- Cánh hoa rơi -->
    <div class="petals" aria-hidden="true">
      <div class="petal" style="left:15%;width:14px;height:12px;animation-duration:8s;animation-delay:0s;--drift:30px"></div>
      <div class="petal" style="left:28%;width:10px;height:10px;animation-duration:6s;animation-delay:2s;--drift:-15px;opacity:0.3"></div>
      <div class="petal" style="left:48%;width:16px;height:14px;animation-duration:9s;animation-delay:1s;--drift:20px"></div>
      <div class="petal" style="left:68%;width:11px;height:10px;animation-duration:7s;animation-delay:3s;--drift:-25px"></div>
      <div class="petal" style="left:85%;width:15px;height:13px;animation-duration:8.5s;animation-delay:0.5s;--drift:15px;opacity:0.4"></div>
    </div>

    <div class="scene-layout" style="justify-content: center;">
        <!-- Cột giữa: Quyển sách 3D -->
        <div class="center-book" style="flex: none; width: 100%;">
            <div class="container-flipbook">
                <div id="flipbook">
                    <!-- Bìa trước -->
                    <div class="page page-cover" data-density="hard">
                        <img src="assets/images/cover-30y-cropped.png" alt="30 năm" class="full-cover">
                    </div>
                    
                    <!-- Mặt trong bìa -->
                    <div class="page page-cover page-cover-inner" data-density="hard">
                        <div class="page-content">
                            <h2 style="font-family: Georgia, serif; color: #a9121a;">LỜI NÓI ĐẦU</h2>
                            <p style="margin-top:20px; font-style: italic;">Hành trình 30 năm vững bước tiên phong...</p>
                        </div>
                    </div>

                    <!-- Javascript tự động chèn 30 trang vào đây -->
                    
                    <!-- Mặt trong bìa sau -->
                    <div class="page page-cover page-cover-inner" data-density="hard">
                        <div class="page-content"></div>
                    </div>
                    
                    <!-- Bìa sau -->
                    <div class="page page-cover" data-density="hard">
                        <div class="page-content">
                            <h3 style="color:#a9121a; font-family: Georgia, serif;">VCM Viettel Commerce</h3>
                            <p>1997 - 2027</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Giữ lại menu mục lục ẩn -->
    <div class="menu-backdrop" data-close-menu></div>
    <aside class="book-menu" aria-hidden="true">
        <!-- ... -->
        <div class="book-menu__head">
            <div><small>MỤC LỤC</small><h1>30 năm Viettel Commerce</h1></div>
            <button type="button" data-close-menu aria-label="Đóng menu">×</button>
        </div>
    </aside>

  </main>
  
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
  <script src="assets/js/flipbook-init.js"></script>
  <script src="assets/js/book-menu.js"></script>
  <script src="assets/js/home-approved.js"></script>
</body>
</html>
